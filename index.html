<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
>

<meta name="theme-color" content="#000000">

<title>Digital Organism</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}

body{
  touch-action:none;
  overscroll-behavior:none;
  user-select:none;
  font-family:Arial,Helvetica,sans-serif;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
}

.ui{
  position:fixed;
  inset:0;
  pointer-events:none;
}

.title{
  position:absolute;
  top:22px;
  left:50%;
  transform:translateX(-50%);

  color:rgba(255,255,255,.42);
  font-size:9px;
  letter-spacing:4px;

  white-space:nowrap;
}

.status{
  position:absolute;
  bottom:24px;
  left:50%;
  transform:translateX(-50%);

  color:rgba(255,255,255,.30);
  font-size:9px;
  letter-spacing:2px;

  white-space:nowrap;
}

.dot{
  display:inline-block;

  width:5px;
  height:5px;

  margin-right:7px;

  border-radius:50%;

  background:#35ffc4;

  box-shadow:
    0 0 8px #35ffc4,
    0 0 18px #35ffc4;
}

</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div class="ui">

  <div class="title">
    DIGITAL ORGANISM
  </div>

  <div class="status">
    <span class="dot"></span>
    <span id="status">
      TOUCH TO CONTROL
    </span>
  </div>

</div>


<script>

(() => {

"use strict";


/* =====================================================
   CANVAS
===================================================== */

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d", {
    alpha:false
  });

const status =
  document.getElementById("status");


let W = window.innerWidth;
let H = window.innerHeight;

let DPR = 1;

let time = 0;


/* =====================================================
   POINTER
===================================================== */

let touching = false;

let pointerId = null;


/*
   Position of finger
*/

const finger = {

  x: W / 2,

  y: H / 2

};


/*
   Moving target.

   Important:
   This target continues moving
   even after finger leaves.
*/

const target = {

  x: W / 2,

  y: H / 2,

  vx: 0,

  vy: 0

};


/* =====================================================
   ORGANISM
===================================================== */

const nodes = [];

const NODE_COUNT = 38;


for(let i = 0; i < NODE_COUNT; i++){

  nodes.push({

    x: W / 2,

    y: H / 2,

    vx: 0,

    vy: 0,

    size:
      15 -
      i * 0.27

  });

}


/* =====================================================
   PARTICLES
===================================================== */

const particles = [];


/* =====================================================
   TRAIL
===================================================== */

const trail = [];


/* =====================================================
   RESIZE
===================================================== */

function resize(){

  DPR =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );


  W =
    window.innerWidth;

  H =
    window.innerHeight;


  canvas.width =
    Math.floor(W * DPR);

  canvas.height =
    Math.floor(H * DPR);


  canvas.style.width =
    W + "px";

  canvas.style.height =
    H + "px";


  ctx.setTransform(
    DPR,
    0,
    0,
    DPR,
    0,
    0
  );


  if(!touching){

    target.x =
      W / 2;

    target.y =
      H / 2;

  }

}

window.addEventListener(
  "resize",
  resize
);

resize();


/* =====================================================
   SET FINGER
===================================================== */

function setFinger(x,y){

  finger.x = x;

  finger.y = y;

}


/* =====================================================
   PARTICLE BURST
===================================================== */

function burst(x,y,count){

  for(
    let i = 0;
    i < count;
    i++
  ){

    const angle =
      Math.random() *
      Math.PI *
      2;


    const speed =
      1 +
      Math.random() * 5;


    particles.push({

      x:x,

      y:y,

      vx:
        Math.cos(angle) *
        speed,

      vy:
        Math.sin(angle) *
        speed,

      life:1,

      size:
        1 +
        Math.random() * 3

    });

  }

}


/* =====================================================
   TOUCH START
===================================================== */

function startTouch(e){

  touching = true;

  pointerId =
    e.pointerId;


  setFinger(
    e.clientX,
    e.clientY
  );


  /*
     Immediately move target
     toward finger.
  */

  target.x =
    e.clientX;

  target.y =
    e.clientY;


  target.vx = 0;

  target.vy = 0;


  status.textContent =
    "TRACKING YOUR FINGER";


  burst(
    e.clientX,
    e.clientY,
    32
  );


  try{

    canvas.setPointerCapture(
      e.pointerId
    );

  }catch(error){}

}


/* =====================================================
   TOUCH MOVE
===================================================== */

function moveTouch(e){

  if(
    pointerId !== null &&
    e.pointerId !== pointerId
  ){

    return;

  }


  if(!touching){

    return;

  }


  setFinger(
    e.clientX,
    e.clientY
  );


  /*
     Save finger trail.
  */

  trail.push({

    x:e.clientX,

    y:e.clientY,

    life:1

  });


  if(trail.length > 100){

    trail.shift();

  }

}


/* =====================================================
   TOUCH END
===================================================== */

function endTouch(e){

  if(
    pointerId !== null &&
    e.pointerId !== pointerId
  ){

    return;

  }


  touching = false;

  pointerId = null;


  status.textContent =
    "FREE MOVEMENT";


  /*
     IMPORTANT:

     We DON'T stop the organism.

     We simply release it from
     finger control.
  */

}


/* =====================================================
   EVENTS
===================================================== */

canvas.addEventListener(
  "pointerdown",
  startTouch,
  {passive:false}
);


canvas.addEventListener(
  "pointermove",
  moveTouch,
  {passive:false}
);


canvas.addEventListener(
  "pointerup",
  endTouch,
  {passive:false}
);


canvas.addEventListener(
  "pointercancel",
  endTouch,
  {passive:false}
);


/* =====================================================
   UPDATE TARGET
===================================================== */

function updateTarget(){

  if(touching){

    /*
       Follow finger smoothly.
    */

    target.vx +=
      (
        finger.x -
        target.x
      ) * 0.20;


    target.vy +=
      (
        finger.y -
        target.y
      ) * 0.20;


    target.vx *= 0.72;

    target.vy *= 0.72;


    target.x +=
      target.vx;

    target.y +=
      target.vy;

  }

  else{

    /*
       FREE MOVEMENT

       The target continuously travels
       around the screen.
    */


    const radius =
      Math.min(W,H) * 0.23;


    const centerX =
      W / 2;

    const centerY =
      H / 2;


    /*
       Multiple sine waves make
       the movement feel alive.
    */

    const freeX =
      centerX +

      Math.cos(
        time * 0.004
      ) *

      radius +

      Math.sin(
        time * 0.009
      ) *

      radius * 0.35;


    const freeY =
      centerY +

      Math.sin(
        time * 0.005
      ) *

      radius +

      Math.cos(
        time * 0.007
      ) *

      radius * 0.30;


    target.vx +=
      (
        freeX -
        target.x
      ) * 0.018;


    target.vy +=
      (
        freeY -
        target.y
      ) * 0.018;


    target.vx *= 0.94;

    target.vy *= 0.94;


    target.x +=
      target.vx;

    target.y +=
      target.vy;

  }


  /*
     Keep target on screen.
  */

  const margin = 40;


  if(target.x < margin){

    target.x = margin;

    target.vx *= -0.5;

  }


  if(target.x > W-margin){

    target.x =
      W-margin;

    target.vx *= -0.5;

  }


  if(target.y < margin){

    target.y = margin;

    target.vy *= -0.5;

  }


  if(target.y > H-margin){

    target.y =
      H-margin;

    target.vy *= -0.5;

  }

}


/* =====================================================
   UPDATE ORGANISM
===================================================== */

function updateOrganism(){

  for(
    let i = 0;
    i < NODE_COUNT;
    i++
  ){

    const node =
      nodes[i];


    const previous =
      i === 0
        ? target
        : nodes[i-1];


    const follow =
      i === 0
        ? 0.12
        : 0.18;


    node.vx +=
      (
        previous.x -
        node.x
      ) * follow;


    node.vy +=
      (
        previous.y -
        node.y
      ) * follow;


    node.vx *= 0.72;

    node.vy *= 0.72;


    node.x +=
      node.vx;

    node.y +=
      node.vy;


    /*
       Body wave.
    */

    const wave =
      Math.sin(
        time * 0.006 +
        i * 0.60
      );


    node.x +=
      Math.cos(
        time * 0.004 +
        i
      ) *
      wave *
      0.16;


    node.y +=
      Math.sin(
        time * 0.005 +
        i
      ) *
      wave *
      0.16;

  }

}


/* =====================================================
   DRAW TRAIL
===================================================== */

function drawTrail(){

  for(
    let i = trail.length - 1;
    i >= 0;
    i--
  ){

    const p =
      trail[i];


    p.life -= 0.025;


    if(p.life <= 0){

      trail.splice(
        i,
        1
      );

      continue;

    }


    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      1.5 +
      (1-p.life)*2,
      0,
      Math.PI*2
    );


    ctx.fillStyle =
      "rgba(52,255,195," +
      (
        p.life * 0.20
      ) +
      ")";


    ctx.fill();

  }

}


/* =====================================================
   DRAW ORGANISM
===================================================== */

function drawOrganism(){

  ctx.save();


  ctx.globalCompositeOperation =
    "lighter";


  /*
     BODY
  */

  for(
    let i = NODE_COUNT - 1;
    i >= 0;
    i--
  ){

    const node =
      nodes[i];


    const progress =
      1 -
      i / NODE_COUNT;


    const radius =
      node.size *
      (
        0.70 +
        progress * 0.30
      );


    /*
       Glow
    */

    ctx.beginPath();

    ctx.arc(
      node.x,
      node.y,
      radius * 3.5,
      0,
      Math.PI*2
    );


    ctx.fillStyle =
      "rgba(52,255,195," +
      (
        0.015 +
        progress * 0.025
      ) +
      ")";


    ctx.fill();


    /*
       Body
    */

    ctx.beginPath();

    ctx.arc(
      node.x,
      node.y,
      radius,
      0,
      Math.PI*2
    );


    ctx.fillStyle =
      "rgba(52,255,195," +
      (
        0.035 +
        progress * 0.23
      ) +
      ")";


    ctx.fill();

  }


  /* =================================================
     HEAD
  ================================================= */

  const head =
    nodes[0];


  const pulse =
    1 +
    Math.sin(
      time * 0.008
    ) * 0.08;


  /*
     HEAD GLOW
  */

  const glow =
    ctx.createRadialGradient(
      head.x,
      head.y,
      0,
      head.x,
      head.y,
      95
    );


  glow.addColorStop(
    0,
    "rgba(255,255,255,.98)"
  );


  glow.addColorStop(
    0.06,
    "rgba(130,255,220,.90)"
  );


  glow.addColorStop(
    0.22,
    "rgba(52,255,195,.24)"
  );


  glow.addColorStop(
    1,
    "rgba(0,0,0,0)"
  );


  ctx.fillStyle =
    glow;


  ctx.fillRect(
    head.x - 95,
    head.y - 95,
    190,
    190
  );


  /*
     HEAD
  */

  ctx.beginPath();

  ctx.arc(
    head.x,
    head.y,
    16 * pulse,
    0,
    Math.PI*2
  );


  ctx.fillStyle =
    "#ecfff9";


  ctx.fill();


  /*
     CORE
  */

  ctx.beginPath();

  ctx.arc(
    head.x,
    head.y,
    6,
    0,
    Math.PI*2
  );


  ctx.fillStyle =
    "#35ffc4";


  ctx.fill();


  /*
     ORBIT PIXELS
  */

  for(
    let i = 0;
    i < 12;
    i++
  ){

    const angle =
      time * 0.003 +
      i *
      (
        Math.PI*2 / 12
      );


    const distance =
      25 +
      Math.sin(
        time * 0.006 +
        i
      ) * 2;


    const px =
      head.x +
      Math.cos(angle) *
      distance;


    const py =
      head.y +
      Math.sin(angle) *
      distance;


    ctx.fillStyle =
      "rgba(52,255,195,.72)";


    ctx.fillRect(
      px - 1,
      py - 1,
      2,
      2
    );

  }


  ctx.restore();

}


/* =====================================================
   PARTICLES
===================================================== */

function updateParticles(){

  ctx.save();


  ctx.globalCompositeOperation =
    "lighter";


  for(
    let i = particles.length - 1;
    i >= 0;
    i--
  ){

    const p =
      particles[i];


    p.x += p.vx;

    p.y += p.vy;


    p.vx *= 0.97;

    p.vy *= 0.97;


    p.life -= 0.018;


    ctx.beginPath();


    ctx.arc(
      p.x,
      p.y,
      p.size * p.life,
      0,
      Math.PI*2
    );


    ctx.fillStyle =
      "rgba(52,255,195," +
      (
        p.life * 0.70
      ) +
      ")";


    ctx.fill();


    if(p.life <= 0){

      particles.splice(
        i,
        1
      );

    }

  }


  ctx.restore();

}


/* =====================================================
   MAIN ANIMATION LOOP
===================================================== */

function animate(){

  time++;


  /*
     RESET CANVAS TRANSFORM
  */

  ctx.setTransform(
    DPR,
    0,
    0,
    DPR,
    0,
    0
  );


  /*
     BLACK BACKGROUND
  */

  ctx.fillStyle =
    "#000";


  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  /*
     ATMOSPHERE
  */

  const backgroundGlow =
    ctx.createRadialGradient(
      target.x,
      target.y,
      0,
      target.x,
      target.y,
      Math.max(W,H)*0.55
    );


  backgroundGlow.addColorStop(
    0,
    "rgba(30,255,190,.045)"
  );


  backgroundGlow.addColorStop(
    1,
    "rgba(0,0,0,0)"
  );


  ctx.fillStyle =
    backgroundGlow;


  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  /*
     UPDATE
  */

  updateTarget();

  updateOrganism();


  /*
     DRAW
  */

  drawTrail();

  drawOrganism();

  updateParticles();


  /*
     NEXT FRAME
  */

  requestAnimationFrame(
    animate
  );

}


/* =====================================================
   START
===================================================== */

animate();

})();

</script>

</body>
</html>
