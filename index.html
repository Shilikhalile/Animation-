<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
>

<meta name="theme-color" content="#000000">

<title>Digital Organism</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}

body{
  touch-action:none;
  overscroll-behavior:none;
  user-select:none;
  font-family:Arial,Helvetica,sans-serif;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
}

.ui{
  position:fixed;
  inset:0;
  pointer-events:none;
}

.title{
  position:absolute;
  top:22px;
  left:50%;
  transform:translateX(-50%);

  color:rgba(255,255,255,.42);
  font-size:9px;
  letter-spacing:4px;

  white-space:nowrap;
}

.status{
  position:absolute;
  bottom:24px;
  left:50%;
  transform:translateX(-50%);

  color:rgba(255,255,255,.30);
  font-size:9px;
  letter-spacing:2px;

  white-space:nowrap;
}

.dot{
  display:inline-block;

  width:5px;
  height:5px;

  margin-right:7px;

  border-radius:50%;

  background:#35ffc4;

  box-shadow:
    0 0 8px #35ffc4,
    0 0 18px #35ffc4;
}

</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div class="ui">

  <div class="title">
    DIGITAL ORGANISM
  </div>

  <div class="status">
    <span class="dot"></span>
    <span id="status">
      TOUCH TO CONTROL
    </span>
  </div>

</div>


<script>

(() => {

"use strict";


/* =====================================================
   CANVAS
===================================================== */

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d", {
    alpha:false
  });

const status =
  document.getElementById("status");


let W = window.innerWidth;
let H = window.innerHeight;

let DPR = 1;

let time = 0;
let animationRunning = false;
let animationFrameId = null;
let lastFrameTimestamp = null;


/* =====================================================
   POINTER
===================================================== */

let touching = false;

let pointerId = null;


/*
   Position of finger
*/

const finger = {

  x: W / 2,

  y: H / 2

};


/*
   Moving target.

   Important:
   This target continues moving
   even after finger leaves.
*/

const target = {

  x: W / 2,

  y: H / 2,

  vx: 0,

  vy: 0

};


/* =====================================================
   ORGANISM
===================================================== */

const nodes = [];

const NODE_COUNT = 38;


for(let i = 0; i < NODE_COUNT; i++){

  /* Start as a softly curved body instead of a single stacked point. */
  const initialX = W / 2 - i * 5;
  const initialY = H / 2 + Math.sin(i * 0.24) * 12;

  nodes.push({

    x: initialX,

    y: initialY,

    vx: 0,

    vy: 0,

    size:
      15 -
      i * 0.27

  });

}


/* =====================================================
   PARTICLES
===================================================== */

/* =====================================================
   TRAIL
===================================================== */

const trail = [];


/* =====================================================
   RESIZE
===================================================== */

function resize(){

  DPR =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );


  W =
    window.innerWidth;

  H =
    window.innerHeight;


  canvas.width =
    Math.floor(W * DPR);

  canvas.height =
    Math.floor(H * DPR);


  canvas.style.width =
    W + "px";

  canvas.style.height =
    H + "px";


  ctx.setTransform(
    DPR,
    0,
    0,
    DPR,
    0,
    0
  );


  if(!touching){

    target.x =
      W / 2;

    target.y =
      H / 2;

  }

}

window.addEventListener(
  "resize",
  resize
);

resize();


/* =====================================================
   SET FINGER
===================================================== */

function setFinger(x,y){

  finger.x = x;

  finger.y = y;

}


/* =====================================================
   TOUCH START
===================================================== */

function startTouch(e){

  touching = true;

  pointerId =
    e.pointerId;


  setFinger(
    e.clientX,
    e.clientY
  );


  target.x =
    e.clientX;

  target.y =
    e.clientY;


  target.vx = 0;

  target.vy = 0;


  status.textContent =
    "TRACKING YOUR FINGER";


  trail.push({
    x:e.clientX,
    y:e.clientY,
    life:1
  });


  try{

    canvas.setPointerCapture(
      e.pointerId
    );

  }catch(error){}

}


/* =====================================================
   TOUCH MOVE
===================================================== */

function moveTouch(e){

  if(
    pointerId !== null &&
    e.pointerId !== pointerId
  ){

    return;

  }


  if(!touching){

    return;

  }


  setFinger(
    e.clientX,
    e.clientY
  );


  /*
     Save finger trail.
  */

  trail.push({

    x:e.clientX,

    y:e.clientY,

    life:1

  });


  if(trail.length > 100){

    trail.shift();

  }

}


/* =====================================================
   TOUCH END
===================================================== */

function releaseTouch(){

  if(!touching){

    return;

  }


  touching = false;

  pointerId = null;


  status.textContent =
    "FREE MOVEMENT";


  /* The organism keeps moving on its own after release. */

}


function endTouch(e){

  if(
    e &&
    pointerId !== null &&
    e.pointerId !== pointerId
  ){

    return;

  }


  releaseTouch();

}


/* =====================================================
   EVENTS
===================================================== */

canvas.addEventListener(
  "pointerdown",
  startTouch,
  {passive:false}
);


canvas.addEventListener(
  "pointermove",
  moveTouch,
  {passive:false}
);


canvas.addEventListener(
  "pointerup",
  endTouch,
  {passive:false}
);


canvas.addEventListener(
  "pointercancel",
  endTouch,
  {passive:false}
);


/* Release pointer control when the page loses focus or is backgrounded. */
window.addEventListener("blur", releaseTouch);
document.addEventListener("visibilitychange", () => {
  if(document.hidden){
    releaseTouch();
    stopAnimation();
  }else{
    startAnimation();
  }
});
window.addEventListener("pageshow", startAnimation);
window.addEventListener("pagehide", stopAnimation);


/* Recover the render loop if the browser recreates the canvas context. */
canvas.addEventListener("contextlost", (event) => {
  event.preventDefault();
  stopAnimation();
  status.textContent = "RESTORING ANIMATION";
});
canvas.addEventListener("contextrestored", startAnimation);


/* =====================================================
   UPDATE TARGET
===================================================== */

function updateTarget(delta = 1){

  if(touching){

    /* Keep the head's target exactly under the finger, with no spring lag. */
    target.x = finger.x;
    target.y = finger.y;
    target.vx = 0;
    target.vy = 0;

  }

  else{

    /*
       FREE MOVEMENT

       The target continuously travels
       around the screen.
    */


    const radius =
      Math.min(W,H) * 0.23;


    const centerX =
      W / 2;

    const centerY =
      H / 2;


    /*
       Multiple sine waves make
       the movement feel alive.
    */

    const freeX =
      centerX +

      Math.cos(
        time * 0.004
      ) *

      radius +

      Math.sin(
        time * 0.009
      ) *

      radius * 0.35;


    const freeY =
      centerY +

      Math.sin(
        time * 0.005
      ) *

      radius +

      Math.cos(
        time * 0.007
      ) *

      radius * 0.30;


    target.vx +=
      (
        freeX -
        target.x
      ) * 0.018 * delta;


    target.vy +=
      (
        freeY -
        target.y
      ) * 0.018 * delta;


    target.vx *= Math.pow(0.94, delta);

    target.vy *= Math.pow(0.94, delta);


    target.x +=
      target.vx * delta;

    target.y +=
      target.vy * delta;

  }


  /* Constrain idle movement, but never offset the head away from a held finger. */
  if(!touching){

    const margin = 40;

    target.x = Math.max(margin, Math.min(W - margin, target.x));
    target.y = Math.max(margin, Math.min(H - margin, target.y));

  }

}


/* =====================================================
   UPDATE ORGANISM
===================================================== */

function updateOrganism(delta = 1){

  for(
    let i = 0;
    i < NODE_COUNT;
    i++
  ){

    const node =
      nodes[i];


    const previous =
      i === 0
        ? target
        : nodes[i-1];


    if(touching && i === 0){

      node.x = target.x;
      node.y = target.y;
      node.vx = 0;
      node.vy = 0;
      continue;

    }


    const follow =
      i === 0
        ? 0.12
        : 0.18;


    node.vx +=
      (
        previous.x -
        node.x
      ) * follow * delta;


    node.vy +=
      (
        previous.y -
        node.y
      ) * follow * delta;


    node.vx *= Math.pow(0.72, delta);

    node.vy *= Math.pow(0.72, delta);


    node.x +=
      node.vx * delta;

    node.y +=
      node.vy * delta;


    /*
       Body wave.
    */

    const wave =
      Math.sin(
        time * 0.006 +
        i * 0.60
      );


    node.x +=
      Math.cos(
        time * 0.004 +
        i
      ) *
      wave *
      0.16 * delta;


    node.y +=
      Math.sin(
        time * 0.005 +
        i
      ) *
      wave *
      0.16 * delta;

  }

}


/* =====================================================
   DRAW TRAIL
===================================================== */

function drawTrail(delta = 1){

  for(
    let i = trail.length - 1;
    i >= 0;
    i--
  ){

    const p =
      trail[i];


    p.life -= 0.025 * delta;


    if(p.life <= 0){

      trail.splice(
        i,
        1
      );

      continue;

    }


  }


  if(trail.length < 2){

    return;

  }


  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  for(let i = 1; i < trail.length; i++){

    const previous = trail[i-1];
    const current = trail[i];
    const life = Math.min(previous.life, current.life);

    ctx.beginPath();
    ctx.moveTo(previous.x, previous.y);
    ctx.lineTo(current.x, current.y);
    ctx.strokeStyle = `rgba(52,255,195,${life * 0.24})`;
    ctx.lineWidth = 1 + life * 3;
    ctx.stroke();

  }

  ctx.restore();

}


/* =====================================================
   DRAW ORGANISM
===================================================== */

function drawOrganism(){

  ctx.save();


  ctx.globalCompositeOperation =
    "lighter";


  /*
     BODY
  */

  for(
    let i = NODE_COUNT - 1;
    i >= 0;
    i--
  ){

    const node =
      nodes[i];


    const progress =
      1 -
      i / NODE_COUNT;


    const radius =
      node.size *
      (
        0.70 +
        progress * 0.30
      );


    /*
       Glow
    */

    ctx.beginPath();

    ctx.arc(
      node.x,
      node.y,
      radius * 3.5,
      0,
      Math.PI*2
    );


    ctx.fillStyle =
      "rgba(52,255,195," +
      (
        0.015 +
        progress * 0.025
      ) +
      ")";


    ctx.fill();


    /*
       Body
    */

    ctx.beginPath();

    ctx.arc(
      node.x,
      node.y,
      radius,
      0,
      Math.PI*2
    );


    ctx.fillStyle =
      "rgba(52,255,195," +
      (
        0.035 +
        progress * 0.23
      ) +
      ")";


    ctx.fill();

  }


  /* =================================================
     HEAD
  ================================================= */

  const head =
    nodes[0];


  const pulse = touching
    ? 1
    : 1 + Math.sin(time * 0.008) * 0.025;


  /*
     HEAD GLOW
  */

  const glow =
    ctx.createRadialGradient(
      head.x,
      head.y,
      0,
      head.x,
      head.y,
      95
    );


  glow.addColorStop(
    0,
    "rgba(255,255,255,.98)"
  );


  glow.addColorStop(
    0.06,
    "rgba(130,255,220,.90)"
  );


  glow.addColorStop(
    0.22,
    "rgba(52,255,195,.24)"
  );


  glow.addColorStop(
    1,
    "rgba(0,0,0,0)"
  );


  ctx.fillStyle =
    glow;


  ctx.fillRect(
    head.x - 95,
    head.y - 95,
    190,
    190
  );


  /*
     HEAD
  */

  ctx.beginPath();

  ctx.arc(
    head.x,
    head.y,
    16 * pulse,
    0,
    Math.PI*2
  );


  ctx.fillStyle =
    "#ecfff9";


  ctx.fill();


  /*
     CORE
  */

  ctx.beginPath();

  ctx.arc(
    head.x,
    head.y,
    6,
    0,
    Math.PI*2
  );


  ctx.fillStyle =
    "#35ffc4";


  ctx.fill();


  /* Fine orbit rings add motion without changing the head's size. */
  ctx.strokeStyle = "rgba(52,255,195,.20)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.ellipse(head.x, head.y, 27, 10, time * 0.0015, 0, Math.PI * 2);
  ctx.stroke();

  ctx.strokeStyle = "rgba(130,255,220,.12)";
  ctx.beginPath();
  ctx.ellipse(head.x, head.y, 35, 13, -time * 0.001, 0, Math.PI * 2);
  ctx.stroke();


  /*
     ORBIT PIXELS
  */

  for(
    let i = 0;
    i < 12;
    i++
  ){

    const angle =
      time * 0.003 +
      i *
      (
        Math.PI*2 / 12
      );


    const distance =
      25 +
      Math.sin(
        time * 0.006 +
        i
      ) * 2;


    const px =
      head.x +
      Math.cos(angle) *
      distance;


    const py =
      head.y +
      Math.sin(angle) *
      distance;


    ctx.fillStyle =
      "rgba(52,255,195,.72)";


    ctx.fillRect(
      px - 1,
      py - 1,
      2,
      2
    );

  }


  ctx.restore();

}


/* =====================================================
   MAIN ANIMATION LOOP
===================================================== */

function animate(timestamp){

  if(!animationRunning){

    return;

  }


  /* Queue the next frame first so one transient drawing error cannot kill the loop. */
  animationFrameId = requestAnimationFrame(animate);


  const now = Number.isFinite(timestamp)
    ? timestamp
    : performance.now();

  const delta = lastFrameTimestamp === null
    ? 1
    : Math.min(
        Math.max((now - lastFrameTimestamp) / (1000 / 60), 0),
        2
      );

  lastFrameTimestamp = now;
  time += delta;


  try{

    ctx.setTransform(
      DPR,
      0,
      0,
      DPR,
      0,
      0
    );


    updateTarget(delta);
    updateOrganism(delta);


    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, W, H);


    const backgroundGlow = ctx.createRadialGradient(
      target.x,
      target.y,
      0,
      target.x,
      target.y,
      Math.max(W,H) * 0.55
    );

    backgroundGlow.addColorStop(0, "rgba(30,255,190,.045)");
    backgroundGlow.addColorStop(1, "rgba(0,0,0,0)");

    ctx.fillStyle = backgroundGlow;
    ctx.fillRect(0, 0, W, H);


    drawTrail(delta);
    drawOrganism();

  }catch(error){

    /* Keep requesting frames and surface a useful diagnostic instead of freezing. */
    console.error("Animation frame recovered after a drawing error:", error);
    status.textContent = "ANIMATION RECOVERING";

  }

}


function startAnimation(){

  if(animationRunning || document.hidden){

    return;

  }


  animationRunning = true;
  lastFrameTimestamp = null;
  animationFrameId = requestAnimationFrame(animate);

}


function stopAnimation(){

  animationRunning = false;

  if(animationFrameId !== null){

    cancelAnimationFrame(animationFrameId);
    animationFrameId = null;

  }


  lastFrameTimestamp = null;

}


/* =====================================================
   START
===================================================== */

startAnimation();

})();

</script>

</body>
</html>
