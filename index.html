<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Digital Organism</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;}
body{touch-action:none;overscroll-behavior:none;user-select:none;font-family:Arial,Helvetica,sans-serif;}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}
.ui{position:fixed;inset:0;pointer-events:none;}
.title{position:absolute;top:22px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.42);font-size:9px;letter-spacing:4px;white-space:nowrap;}
.status{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.30);font-size:9px;letter-spacing:2px;white-space:nowrap;}
.dot{display:inline-block;width:5px;height:5px;margin-right:7px;border-radius:50%;background:#35ffc4;box-shadow:0 0 8px #35ffc4,0 0 18px #35ffc4;}
.colors-toggle{position:absolute;top:18px;right:18px;display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid rgba(130,255,220,.24);border-radius:999px;background:rgba(4,18,16,.78);color:rgba(235,255,249,.88);font-size:9px;letter-spacing:1.8px;cursor:pointer;pointer-events:auto;touch-action:manipulation;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:border-color .18s ease,background .18s ease,transform .18s ease;}
.colors-toggle:hover,.colors-toggle[aria-expanded="true"]{border-color:rgba(130,255,220,.58);background:rgba(9,30,25,.92);transform:translateY(-1px);}
.colors-toggle:focus-visible,.preset:focus-visible,.colors-panel input:focus-visible{outline:2px solid rgba(130,255,220,.8);outline-offset:3px;}
.colors-icon{width:10px;height:10px;border:1px solid rgba(255,255,255,.65);border-radius:50%;background:linear-gradient(135deg,#34ffc3 50%,#ae8aff 50%);box-shadow:0 0 10px rgba(52,255,195,.42);}
.colors-panel{position:absolute;top:62px;right:18px;width:232px;padding:14px;border:1px solid rgba(130,255,220,.2);border-radius:14px;background:rgba(5,13,14,.91);color:rgba(239,255,250,.84);box-shadow:0 14px 44px rgba(0,0,0,.42),0 0 26px rgba(52,255,195,.07);pointer-events:auto;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);}
.colors-panel[hidden]{display:none;}
.panel-title{margin-bottom:12px;color:rgba(255,255,255,.48);font-size:8px;letter-spacing:2px;}
.color-row{display:flex;align-items:center;justify-content:space-between;min-height:38px;color:rgba(239,255,250,.8);font-size:11px;letter-spacing:.5px;}
.color-row input[type="color"]{width:38px;height:26px;padding:2px;border:1px solid rgba(255,255,255,.2);border-radius:7px;background:rgba(255,255,255,.08);cursor:pointer;}
.color-row input[type="checkbox"]{width:16px;height:16px;accent-color:#34ffc3;cursor:pointer;}
.presets-label{margin:10px 0 8px;color:rgba(255,255,255,.38);font-size:8px;letter-spacing:1.5px;}
.presets{display:flex;flex-wrap:wrap;gap:6px;}
.preset{padding:7px 8px;border:1px solid rgba(255,255,255,.12);border-radius:999px;background:rgba(255,255,255,.04);color:rgba(245,255,250,.72);font-size:8px;letter-spacing:.7px;cursor:pointer;touch-action:manipulation;}
.preset:hover{border-color:rgba(130,255,220,.45);color:#fff;}
@media(max-width:480px){
  .title{left:14px;transform:none;letter-spacing:2.5px;}
  .colors-toggle{top:12px;right:12px;padding:9px 10px;}
  .colors-panel{top:56px;right:12px;width:min(232px,calc(100vw - 24px));}
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="ui">
  <div class="title">DIGITAL ORGANISM</div>
  <button id="colorsToggle" class="colors-toggle" type="button" aria-expanded="false" aria-controls="colorsPanel">
    <span class="colors-icon" aria-hidden="true"></span>
    <span>COLORS</span>
  </button>
  <section id="colorsPanel" class="colors-panel" aria-label="Light effect colors" hidden>
    <div class="panel-title">LIVE LIGHT COLORS</div>
    <label class="color-row" for="trailColor">
      <span>Finger trail</span>
      <input id="trailColor" type="color" value="#34ffc3">
    </label>
    <label class="color-row" for="ringColor">
      <span>Orbit rings</span>
      <input id="ringColor" type="color" value="#34ffc3">
    </label>
    <label class="color-row" for="touchSound">
      <span>Touch chime</span>
      <input id="touchSound" type="checkbox" checked>
    </label>
    <div class="presets-label">QUICK PALETTES</div>
    <div class="presets">
      <button class="preset" type="button" data-trail="#34ffc3" data-rings="#82ffdc">JADE</button>
      <button class="preset" type="button" data-trail="#9d74ff" data-rings="#d1adff">VIOLET</button>
      <button class="preset" type="button" data-trail="#ff875f" data-rings="#ffd17a">EMBER</button>
      <button class="preset" type="button" data-trail="#4bdcff" data-rings="#a4f2ff">ICE</button>
    </div>
  </section>
  <div class="status">
    <span class="dot"></span>
    <span id="status">TOUCH TO CONTROL</span>
  </div>
</div>
<script>
(() => {
"use strict";

/* =====================================================
   DOM
===================================================== */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", { alpha: false });

const status = document.getElementById("status");
const colorsToggle = document.getElementById("colorsToggle");
const colorsPanel = document.getElementById("colorsPanel");
const trailColorInput = document.getElementById("trailColor");
const ringColorInput = document.getElementById("ringColor");
const touchSoundToggle = document.getElementById("touchSound");

let trailColor = trailColorInput.value;
let ringColor = ringColorInput.value;
let touchSoundEnabled = touchSoundToggle.checked;
let audioContext = null;

function colorWithAlpha(hex, alpha){
  const v = hex.replace("#","");
  const r = parseInt(v.slice(0,2),16);
  const g = parseInt(v.slice(2,4),16);
  const b = parseInt(v.slice(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

/* =====================================================
   AUDIO
===================================================== */
function playTouchChime(){
  if(!touchSoundEnabled) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  try{
    if(!audioContext) audioContext = new AC();
    if(audioContext.state === "suspended") audioContext.resume();

    const now = audioContext.currentTime;
    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();

    osc.type = "sine";
    osc.frequency.setValueAtTime(740, now);
    osc.frequency.exponentialRampToValueAtTime(1180, now + .11);

    gain.gain.setValueAtTime(.0001, now);
    gain.gain.exponentialRampToValueAtTime(.045, now + .012);
    gain.gain.exponentialRampToValueAtTime(.0001, now + .24);

    osc.connect(gain);
    gain.connect(audioContext.destination);
    osc.start(now);
    osc.stop(now + .25);
  }catch(e){ console.warn("Chime unavailable", e); }
}

/* =====================================================
   UI CONTROLS
===================================================== */
function setColorsPanelOpen(open){
  colorsPanel.hidden = !open;
  colorsToggle.setAttribute("aria-expanded", String(open));
}

colorsToggle.addEventListener("click", () => setColorsPanelOpen(colorsPanel.hidden));
trailColorInput.addEventListener("input", () => trailColor = trailColorInput.value);
ringColorInput.addEventListener("input", () => ringColor = ringColorInput.value);
touchSoundToggle.addEventListener("change", () => touchSoundEnabled = touchSoundToggle.checked);

for(const preset of colorsPanel.querySelectorAll(".preset")){
  preset.addEventListener("click", () => {
    trailColor = preset.dataset.trail;
    ringColor = preset.dataset.rings;
    trailColorInput.value = trailColor;
    ringColorInput.value = ringColor;
  });
}

window.addEventListener("keydown", (event) => {
  if(event.key === "Escape" && !colorsPanel.hidden){
    setColorsPanelOpen(false);
    colorsToggle.focus();
  }
});

/* =====================================================
   CANVAS / STATE
===================================================== */
let W = window.innerWidth;
let H = window.innerHeight;
let DPR = 1;

let time = 0;
let animationRunning = false;
let animationFrameId = null;
let lastFrameTimestamp = null;

let touching = false;
let pointerId = null;

const finger = { x: W/2, y: H/2 };
const target = { x: W * .14, y: H * .48, vx: 0, vy: 0 };

/* =====================================================
   ORGANISM NODES
===================================================== */
const nodes = [];
const NODE_COUNT = 46;
const initialSpan = W * .72;

for(let i = 0; i < NODE_COUNT; i++){
  const progress = i / (NODE_COUNT - 1);
  const initialX = (W - initialSpan) / 2 + progress * initialSpan;
  const initialY = H * .48 - H * .18 * Math.sin(Math.PI * progress) + H * .31 * Math.pow(progress,5) + Math.sin(i * .24) * 4;
  nodes.push({
    x: initialX, y: initialY,
    vx: 0, vy: 0,
    size: 15 - i * .27
  });
}

const trail = [];
const touchRipples = [];
const sparks = [];

/* =====================================================
   RESIZE
===================================================== */
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width  = W + "px";
  canvas.style.height = H + "px";

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  if(!touching){ target.x = W * .14; target.y = H * .48; }
}
window.addEventListener("resize", resize);
resize();

/* =====================================================
   POINTER
===================================================== */
function setFinger(x,y){ finger.x = x; finger.y = y; }

function startTouch(e){
  touching = true;
  pointerId = e.pointerId;

  setFinger(e.clientX, e.clientY);
  target.x = e.clientX;
  target.y = e.clientY;
  target.vx = 0;
  target.vy = 0;

  status.textContent = "TRACKING YOUR FINGER";
  playTouchChime();

  touchRipples.push({ x:e.clientX, y:e.clientY, radius:8, life:1 });
  if(touchRipples.length > 5) touchRipples.shift();

  for(let i = 0; i < 8; i++){
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 3;
    sparks.push({
      x: e.clientX, y: e.clientY,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1
    });
  }
  if(sparks.length > 120) sparks.splice(0, sparks.length - 120);

  trail.push({ x:e.clientX, y:e.clientY, life:1 });

  try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
}

function moveTouch(e){
  if(pointerId !== null && e.pointerId !== pointerId) return;
  if(!touching) return;

  setFinger(e.clientX, e.clientY);
  trail.push({ x:e.clientX, y:e.clientY, life:1 });
  if(trail.length > 100) trail.shift();
}

function releaseTouch(){
  if(!touching) return;
  touching = false;
  pointerId = null;
  status.textContent = "FREE MOVEMENT";
}

function endTouch(e){
  if(e && pointerId !== null && e.pointerId !== pointerId) return;
  releaseTouch();
}

canvas.addEventListener("pointerdown", startTouch, { passive:false });
canvas.addEventListener("pointermove", moveTouch, { passive:false });
canvas.addEventListener("pointerup", endTouch, { passive:false });
canvas.addEventListener("pointercancel", endTouch, { passive:false });

window.addEventListener("blur", releaseTouch);
document.addEventListener("visibilitychange", () => {
  if(document.hidden){ releaseTouch(); stopAnimation(); }
  else { startAnimation(); }
});
window.addEventListener("pageshow", startAnimation);
window.addEventListener("pagehide", stopAnimation);
  
/* =====================================================
   CONTEXT LOST / RESTORED
===================================================== */
canvas.addEventListener("contextlost", (event) => {
  event.preventDefault();
  stopAnimation();
  status.textContent = "RESTORING ANIMATION";
});
canvas.addEventListener("contextrestored", startAnimation);

/* =====================================================
   UPDATE TARGET
===================================================== */
function updateTarget(delta = 1){
  if(touching){
    target.x = finger.x;
    target.y = finger.y;
    target.vx = 0;
    target.vy = 0;
  } else {
    const radius = Math.min(W,H) * 0.23;
    const centerX = W/2;
    const centerY = H/2;

    const freeX = centerX + Math.cos(time * 0.004) * radius + Math.sin(time * 0.009) * radius * 0.35;
    const freeY = centerY + Math.sin(time * 0.005) * radius + Math.cos(time * 0.007) * radius * 0.30;

    target.vx += (freeX - target.x) * 0.018 * delta;
    target.vy += (freeY - target.y) * 0.018 * delta;
    target.vx *= Math.pow(0.94, delta);
    target.vy *= Math.pow(0.94, delta);

    target.x += target.vx * delta;
    target.y += target.vy * delta;

    const margin = 40;
    target.x = Math.max(margin, Math.min(W - margin, target.x));
    target.y = Math.max(margin, Math.min(H - margin, target.y));
  }
}

/* =====================================================
   UPDATE ORGANISM
===================================================== */
function updateOrganism(delta = 1){
  for(let i = 0; i < NODE_COUNT; i++){
    const node = nodes[i];
    const previous = i === 0 ? target : nodes[i-1];

    if(i === 0){
      node.x = target.x;
      node.y = target.y;
      node.vx = 0;
      node.vy = 0;
      continue;
    }

    const follow = i === 0 ? 0.12 : 0.18;

    node.vx += (previous.x - node.x) * follow * delta;
    node.vy += (previous.y - node.y) * follow * delta;

    node.vx *= Math.pow(0.72, delta);
    node.vy *= Math.pow(0.72, delta);

    node.x += node.vx * delta;
    node.y += node.vy * delta;

    const wave = Math.sin(time * 0.006 + i * 0.60);
    node.x += Math.cos(time * 0.004 + i) * wave * 0.16 * delta;
    node.y += Math.sin(time * 0.005 + i) * wave * 0.16 * delta;
  }
}

function constrainSegments(){

  const maxSegmentLength = initialSpan / (NODE_COUNT - 1) * 3.4;

  for(let i = 1; i < nodes.length; i++){

    const previous = nodes[i-1];
    const node = nodes[i];
    const dx = node.x - previous.x;
    const dy = node.y - previous.y;
    const distance = Math.hypot(dx,dy);

    if(distance > maxSegmentLength){

      const scale = maxSegmentLength / distance;
      node.x = previous.x + dx * scale;
      node.y = previous.y + dy * scale;
      node.vx *= .45;
      node.vy *= .45;

    }

  }

}


/* =====================================================
   DRAW RIPPLE
===================================================== */
function drawTouchRipples(delta = 1){
  ctx.save();
  ctx.globalCompositeOperation = "lighter";

  for(let i = touchRipples.length - 1; i >= 0; i--){
    const r = touchRipples[i];
    r.radius += 2.2 * delta;
    r.life -= 0.035 * delta;

    if(r.life <= 0){ touchRipples.splice(i,1); continue; }

    ctx.beginPath();
    ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
    ctx.strokeStyle = colorWithAlpha(ringColor, r.life * .58);
    ctx.lineWidth = 1 + r.life * 1.5;
    ctx.stroke();
  }
  ctx.restore();
}

/* =====================================================
   DRAW TRAIL
===================================================== */
function drawTrail(delta = 1){
  for(let i = trail.length - 1; i >= 0; i--){
    const p = trail[i];
    p.life -= 0.025 * delta;
    if(p.life <= 0){ trail.splice(i,1); continue; }
  }

  if(trail.length < 2) return;

  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  for(let i = 1; i < trail.length; i++){
    const prev = trail[i-1];
    const cur = trail[i];
    const life = Math.min(prev.life, cur.life);

    ctx.beginPath();
    ctx.moveTo(prev.x, prev.y);
    ctx.lineTo(cur.x, cur.y);
    ctx.strokeStyle = colorWithAlpha(trailColor, life * 0.24);
    ctx.lineWidth = 1 + life * 3;
    ctx.stroke();
  }
  ctx.restore();
}

/* =====================================================
   DRAW SPARKS
===================================================== */
function drawSparks(delta = 1){
  ctx.save();
  ctx.globalCompositeOperation = "lighter";

  for(let i = sparks.length - 1; i >= 0; i--){
    const s = sparks[i];
    s.x += s.vx * delta;
    s.y += s.vy * delta;
    s.vx *= Math.pow(0.94, delta);
    s.vy *= Math.pow(0.94, delta);
    s.life -= 0.025 * delta;

    if(s.life <= 0){ sparks.splice(i,1); continue; }

    ctx.beginPath();
    ctx.arc(s.x, s.y, s.life * 2.2, 0, Math.PI * 2);
    ctx.fillStyle = colorWithAlpha(trailColor, s.life * 0.9);
    ctx.fill();
  }
  ctx.restore();
}

function drawSkeleton(head,heading){

  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.lineCap = "round";
  ctx.lineJoin = "round";


  /* A faint continuous backbone holds the articulated segments together. */
  ctx.beginPath();
  ctx.moveTo(nodes[0].x,nodes[0].y);

  for(let i = 1; i < nodes.length; i++){

    ctx.lineTo(nodes[i].x,nodes[i].y);

  }

  ctx.strokeStyle = colorWithAlpha(trailColor,.20);
  ctx.lineWidth = 9;
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(nodes[0].x,nodes[0].y);

  for(let i = 1; i < nodes.length; i++){

    ctx.lineTo(nodes[i].x,nodes[i].y);

  }

  ctx.strokeStyle = colorWithAlpha(ringColor,.82);
  ctx.lineWidth = 1.5;
  ctx.stroke();


  /* Repeated oval ribs follow the spine and taper at both ends. */
  for(let i = 1; i < nodes.length - 1; i++){

    const node = nodes[i];
    const before = nodes[i-1];
    const after = nodes[i+1];
    const spineAngle = Math.atan2(after.y - before.y,after.x - before.x);
    const taper = Math.sin(Math.PI * i / (nodes.length - 1));
    const ribLength = 3 + taper * 22;
    const alpha = .38 + (i % 2) * .22 + taper * .18;

    ctx.beginPath();
    ctx.ellipse(node.x,node.y,4.2,ribLength,spineAngle,0,Math.PI*2);
    ctx.strokeStyle = colorWithAlpha(ringColor,alpha);
    ctx.lineWidth = .9 + taper * .55;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(node.x,node.y,1.35,0,Math.PI*2);
    ctx.fillStyle = colorWithAlpha(trailColor,.72);
    ctx.fill();

  }


  const tail = nodes[nodes.length - 1];
  const tailBefore = nodes[nodes.length - 2];
  const tailLength = Math.hypot(tail.x - tailBefore.x,tail.y - tailBefore.y) || 1;
  const tailX = (tail.x - tailBefore.x) / tailLength;
  const tailY = (tail.y - tailBefore.y) / tailLength;
  const tailNormalX = -tailY;
  const tailNormalY = tailX;
  const tailTipX = tail.x + tailX * 17;
  const tailTipY = tail.y + tailY * 17;

  ctx.beginPath();
  ctx.moveTo(tail.x,tail.y);
  ctx.lineTo(tailTipX,tailTipY);
  ctx.moveTo(tail.x + tailNormalX * 4,tail.y + tailNormalY * 4);
  ctx.lineTo(tailTipX + tailNormalX * 8,tailTipY + tailNormalY * 8);
  ctx.moveTo(tail.x - tailNormalX * 4,tail.y - tailNormalY * 4);
  ctx.lineTo(tailTipX - tailNormalX * 8,tailTipY - tailNormalY * 8);
  ctx.strokeStyle = colorWithAlpha(ringColor,.72);
  ctx.lineWidth = 1.2;
  ctx.stroke();


  /* Five articulated leg pairs with bright joints and small hooked feet. */
  for(let i = 7; i < nodes.length - 4; i += 8){

    const node = nodes[i];
    const before = nodes[i-1];
    const after = nodes[i+1];
    const dx = after.x - before.x;
    const dy = after.y - before.y;
    const length = Math.hypot(dx,dy) || 1;
    const tangentX = dx / length;
    const tangentY = dy / length;
    const normalX = -tangentY;
    const normalY = tangentX;
    const bodyTaper = Math.sin(Math.PI * i / (nodes.length - 1));
    const legLength = 20 + bodyTaper * 13;
    const bendDirection = i % 16 === 7 ? 1 : -1;

    for(const side of [-1,1]){

      const kneeX = node.x + normalX * side * legLength * .52 + tangentX * bendDirection * legLength * .28;
      const kneeY = node.y + normalY * side * legLength * .52 + tangentY * bendDirection * legLength * .28;
      const footX = kneeX + normalX * side * legLength * .46 + tangentX * bendDirection * legLength * .38;
      const footY = kneeY + normalY * side * legLength * .46 + tangentY * bendDirection * legLength * .38;

      ctx.beginPath();
      ctx.moveTo(node.x,node.y);
      ctx.lineTo(kneeX,kneeY);
      ctx.lineTo(footX,footY);
      ctx.strokeStyle = colorWithAlpha(ringColor,.82);
      ctx.lineWidth = 1.7;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(kneeX,kneeY,2,0,Math.PI*2);
      ctx.fillStyle = colorWithAlpha(trailColor,.96);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(footX,footY);
      ctx.lineTo(footX + tangentX * bendDirection * 4 - normalX * side * 3,
                 footY + tangentY * bendDirection * 4 - normalY * side * 3);
      ctx.strokeStyle = colorWithAlpha(ringColor,.7);
      ctx.lineWidth = 1;
      ctx.stroke();

    }

  }


  /* Small angular skull points in the direction the creature is moving. */
  ctx.save();
  ctx.translate(head.x,head.y);
  ctx.rotate(heading);
  ctx.beginPath();
  ctx.moveTo(16,0);
  ctx.lineTo(8,-6);
  ctx.lineTo(-4,-7);
  ctx.lineTo(-12,-3);
  ctx.lineTo(-13,3);
  ctx.lineTo(-4,7);
  ctx.lineTo(8,6);
  ctx.closePath();
  ctx.fillStyle = colorWithAlpha(trailColor,.22);
  ctx.fill();
  ctx.strokeStyle = colorWithAlpha(ringColor,.95);
  ctx.lineWidth = 1.6;
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(1,-5);
  ctx.lineTo(8,-2);
  ctx.moveTo(1,5);
  ctx.lineTo(8,2);
  ctx.strokeStyle = colorWithAlpha(ringColor,.78);
  ctx.lineWidth = 1.1;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(8,0,1.5,0,Math.PI*2);
  ctx.fillStyle = "#f4fffc";
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(12,-2);
  ctx.quadraticCurveTo(22,-11,29,-9);
  ctx.moveTo(12,2);
  ctx.quadraticCurveTo(23,10,30,8);
  ctx.strokeStyle = colorWithAlpha(ringColor,.76);
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.restore();

  ctx.restore();

}


function drawOrganism(){

  ctx.save();


  ctx.globalCompositeOperation =
    "lighter";


  /* Small lit joints reveal the skeleton's repeating articulated segments. */
  for(let i = 0; i < nodes.length; i++){

    const node = nodes[i];
    const taper = Math.sin(Math.PI * i / (nodes.length - 1));

    ctx.beginPath();
    ctx.arc(node.x,node.y,1.1 + taper * .65,0,Math.PI*2);
    ctx.fillStyle = colorWithAlpha(trailColor,.52 + taper * .32);
    ctx.fill();

  }


  /* =================================================
     HEAD
  ================================================= */

  const head =
    nodes[0];


  const tail = nodes[1];
  const heading = Math.atan2(head.y - tail.y, head.x - tail.x);

  const glow = ctx.createRadialGradient(
    head.x,
    head.y,
    0,
    head.x,
    head.y,
    42
  );

  glow.addColorStop(0,"rgba(255,255,255,.34)");
  glow.addColorStop(.22,colorWithAlpha(ringColor,.25));
  glow.addColorStop(.58,colorWithAlpha(trailColor,.09));
  glow.addColorStop(1,"rgba(0,0,0,0)");

  ctx.fillStyle = glow;
  ctx.fillRect(head.x - 42,head.y - 42,84,84);

  drawSkeleton(head,heading);


  /* Fine orbit rings add motion without changing the head's size. */
  ctx.strokeStyle = colorWithAlpha(ringColor, .20);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.ellipse(head.x, head.y, 27, 10, time * 0.0015, 0, Math.PI * 2);
  ctx.stroke();

  ctx.strokeStyle = colorWithAlpha(ringColor, .12);
  ctx.beginPath();
  ctx.ellipse(head.x, head.y, 35, 13, -time * 0.001, 0, Math.PI * 2);
  ctx.stroke();


  /*
     ORBIT PIXELS
  */

  for(
    let i = 0;
    i < 12;
    i++
  ){

    const angle =
      time * 0.003 +
      i *
      (
        Math.PI*2 / 12
      );


    const distance =
      25 +
      Math.sin(
        time * 0.006 +
        i
      ) * 2;


    const px =
      head.x +
      Math.cos(angle) *
      distance;


    const py =
      head.y +
      Math.sin(angle) *
      distance;


    ctx.fillStyle =
      colorWithAlpha(ringColor, .72);


    ctx.fillRect(
      px - 1,
      py - 1,
      2,
      2
    );

  }


  ctx.restore();

}


/* =====================================================
   RENDER
===================================================== */
function render(delta){
  ctx.fillStyle = "rgba(0,0,0,0.22)";
  ctx.fillRect(0, 0, W, H);

  updateTarget(delta);
  updateOrganism(delta);
  constrainSegments();

  drawTrail(delta);
  drawTouchRipples(delta);
  drawSparks(delta);
  drawOrganism();
}

/* =====================================================
   LOOP
===================================================== */
function loop(timestamp){
  if(!animationRunning) return;

  if(lastFrameTimestamp === null) lastFrameTimestamp = timestamp;

  const rawDelta = (timestamp - lastFrameTimestamp) / 16.6667;
  lastFrameTimestamp = timestamp;

  const delta = Math.min(Math.max(rawDelta, 0.2), 2.5);

  time += 16.6667 * delta;

  render(delta);

  animationFrameId = requestAnimationFrame(loop);
}

function startAnimation(){
  if(animationRunning) return;
  animationRunning = true;
  lastFrameTimestamp = null;
  animationFrameId = requestAnimationFrame(loop);
}

function stopAnimation(){
  animationRunning = false;
  if(animationFrameId !== null){
    cancelAnimationFrame(animationFrameId);
    animationFrameId = null;
  }
}

/* =====================================================
   KICK OFF
===================================================== */
startAnimation();
  
})();
</script>
